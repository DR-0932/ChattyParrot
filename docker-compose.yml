services:
  agent:
    build: ./apps/agent
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface

  server:
    build: ./apps/server
    environment:
      AGENT_URL: http://agent:8000
    ports:
      - "3000:3000"
    depends_on:
      - agent

  frontend:
    build:
      context: ./apps/web/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - server
volumes:
  hf_cache: