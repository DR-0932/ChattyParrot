services:
  agent:
    build: ./apps/agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - qdrant_data:/app/qdrant_data
    restart: unless-stopped

  server:
    build: ./apps/server
    environment:
      AGENT_URL: http://agent:8000
    ports:
      - "3000:3000"
    depends_on:
      - agent
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/web/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  hf_cache:
  qdrant_data: